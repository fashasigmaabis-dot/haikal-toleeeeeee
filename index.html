<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DompetKu - Personal Budget Tracker</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #4361ee;
            --primary-hover: #3a0ca3;
            --success: #2ec4b6;
            --danger: #e71d36;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Balance Cards */
        .balance-container {
            margin-bottom: 24px;
        }

        .total-balance {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .total-balance h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 6px;
        }

        .total-balance #balance {
            font-size: 2rem;
            font-weight: 700;
        }

        .income-expense {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .ie-card {
            background: var(--bg-color);
            padding: 14px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .ie-card h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .ie-card p {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .ie-card.income p {
            color: var(--success);
        }

        .ie-card.expense p {
            color: var(--danger);
        }

        /* Form Section */
        .form-section {
            margin-bottom: 24px;
        }

        .form-section h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #fff;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 4px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* Transaction History */
        .history-section h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-list {
            list-style: none;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .transaction-list::-webkit-scrollbar {
            width: 6px;
        }

        .transaction-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary);
            position: relative;
            transition: transform 0.2s ease;
        }

        .transaction-item.income {
            border-left-color: var(--success);
        }

        .transaction-item.expense {
            border-left-color: var(--danger);
        }

        .transaction-info span {
            display: block;
        }

        .transaction-info .text {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .transaction-info .date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .transaction-amount {
            font-weight: 600;
            font-size: 0.95rem;
            margin-right: 28px;
        }

        .btn-delete {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.2s;
            padding: 4px;
        }

        .transaction-item:hover .btn-delete {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding: 16px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>DompetKu</h1>
            <p>Aplikasi Pengelola Keuangan Pribadi</p>
        </header>

        <!-- Ringkasan Saldo -->
        <div class="balance-container">
            <div class="total-balance">
                <h2>Total Saldo</h2>
                <div id="balance">Rp 0</div>
            </div>
            <div class="income-expense">
                <div class="ie-card income">
                    <h3>Pemasukan</h3>
                    <p id="total-income">Rp 0</p>
                </div>
                <div class="ie-card expense">
                    <h3>Pengeluaran</h3>
                    <p id="total-expense">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="form-section">
            <h2>Tambah Transaksi Baru</h2>
            <form id="form-transaksi">
                <div class="form-group">
                    <label for="text">Keterangan</label>
                    <input type="text" id="text" placeholder="Contoh: Gaji Bulanan, Beli Kopi..." required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="amount">Jumlah (Rp)</label>
                    <input type="number" id="amount" placeholder="Contoh: 50000" min="1" required>
                </div>
                <div class="form-group">
                    <label for="type">Jenis Transaksi</label>
                    <select id="type">
                        <option value="income">Pemasukan (Income)</option>
                        <option value="expense">Pengeluaran (Expense)</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Tambah Transaksi</button>
            </form>
        </div>

        <!-- Riwayat Transaksi -->
        <div class="history-section">
            <h2>Riwayat Transaksi</h2>
            <ul id="list" class="transaction-list">
                <!-- Daftar transaksi akan dimasukkan lewat JavaScript -->
            </ul>
        </div>
    </div>

    <script>
        // Ambil elemen dari DOM
        const balanceEl = document.getElementById('balance');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const listEl = document.getElementById('list');
        const formEl = document.getElementById('form-transaksi');
        const textInput = document.getElementById('text');
        const amountInput = document.getElementById('amount');
        const typeSelect = document.getElementById('type');

        // Ambil data dari localStorage atau buat array kosong
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        // Format angka ke format mata uang Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        }

        // Fungsi untuk menambahkan transaksi baru
        function addTransaction(e) {
            e.preventDefault();

            if (textInput.value.trim() === '' || amountInput.value.trim() === '') {
                alert('Mohon isi semua data dengan benar!');
                return;
            }

            const transaction = {
                id: generateID(),
                text: textInput.value,
                amount: +amountInput.value,
                type: typeSelect.value,
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
            };

            transactions.push(transaction);
            
            updateLocalStorage();
            init();

            // Reset form
            textInput.value = '';
            amountInput.value = '';
            typeSelect.value = 'income';
        }

        // Generate ID unik
        function generateID() {
            return Math.floor(Math.random() * 100000000);
        }

        // Hapus transaksi berdasarkan ID
        function removeTransaction(id) {
            transactions = transactions.filter(transaction => transaction.id !== id);
            updateLocalStorage();
            init();
        }

        // Update localStorage
        function updateLocalStorage() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        // Render transaksi ke dalam DOM & Hitung Total
        function init() {
            listEl.innerHTML = '';

            if (transactions.length === 0) {
                listEl.innerHTML = '<li class="empty-state">Belum ada riwayat transaksi.</li>';
            } else {
                transactions.forEach(addTransactionDOM);
            }

            updateValues();
        }

        // Tampilkan transaksi ke dalam elemen <ul>
        function addTransactionDOM(transaction) {
            const sign = transaction.type === 'income' ? '+' : '-';
            const item = document.createElement('li');

            item.classList.add('transaction-item');
            item.classList.add(transaction.type);

            item.innerHTML = `
                <div class="transaction-info">
                    <span class="text">${transaction.text}</span>
                    <span class="date">${transaction.date}</span>
                </div>
                <div class="transaction-amount" style="color: ${transaction.type === 'income' ? 'var(--success)' : 'var(--danger)'}">
                    ${sign} ${formatRupiah(transaction.amount)}
                </div>
                <button class="btn-delete" onclick="removeTransaction(${transaction.id})">&times;</button>
            `;

            listEl.appendChild(item);
        }

        // Hitung total saldo, pemasukan, dan pengeluaran
        function updateValues() {
            const amounts = transactions.map(transaction => 
                transaction.type === 'income' ? transaction.amount : -transaction.amount
            );

            const total = amounts.reduce((acc, item) => (acc += item), 0);

            const income = transactions
                .filter(transaction => transaction.type === 'income')
                .reduce((acc, transaction) => (acc += transaction.amount), 0);

            const expense = transactions
                .filter(transaction => transaction.type === 'expense')
                .reduce((acc, transaction) => (acc += transaction.amount), 0);

            balanceEl.innerText = formatRupiah(total);
            totalIncomeEl.innerText = formatRupiah(income);
            totalExpenseEl.innerText = formatRupiah(expense);
        }

        // Event Listener Form Submit
        formEl.addEventListener('submit', addTransaction);

        // Jalankan aplikasi pertama kali
        init();
    </script>
</body>
</html>
